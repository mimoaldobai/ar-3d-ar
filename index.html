<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض نموذج ثلاثي الأبعاد في الواقع المعزز</title>

  <!-- تحميل مكتبة model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #111;
      margin: 0;
      flex-direction: column;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background-color: #222;
      border-radius: 10px;
    }

    .ar-button {
      background-color: #00aaff;
      color: white;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- عنصر عرض النموذج ثلاثي الأبعاد -->
  <model-viewer
    id="modelViewer"
    alt="بدلة الفضاء لنيل آرمسترونغ"
    src="./NeilArmstrong.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
    poster="./chair.jpg"
    shadow-intensity="1"
    camera-controls
    touch-action="pan-y"
    loading="lazy"
    autoplay
  ></model-viewer>

  <!-- زر تشغيل الواقع المعزز -->
  <button id="arButton" class="ar-button">عرض في الواقع المعزز</button>

  <script>
    const modelViewer = document.getElementById("modelViewer");
    const arButton = document.getElementById("arButton");

    // أظهر الزر فقط إذا كان AR متاحًا
    modelViewer.addEventListener("ar-status", (event) => {
      if (event.detail.status === "ready" && modelViewer.canActivateAR) {
        arButton.style.display = "inline-block";
      }
    });

    // عند الضغط على زر AR
    arButton.addEventListener("click", () => {
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        alert("جهازك لا يدعم الواقع المعزز.");
      }
    });

    // تقليل جودة التفاعل على الأجهزة الضعيفة
    if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) {
      modelViewer.setAttribute('reveal', 'interaction'); // حمّل النموذج فقط بعد التفاعل
    }
  </script>
</body>
</html>
